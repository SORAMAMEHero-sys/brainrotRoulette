<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブレインロットカジノ</title>
    <style>
        :root {
            --bg-color: #0f051d;
            --panel-bg: #1a0b2e;
            --accent-glow: #ff007f;
            --accent-gold: #ffd700;
            --text-main: #ffffff;
            --text-sub: #b19cd9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-gold);
            text-shadow: 0 0 10px var(--accent-glow);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-glow);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            flex: 1;
            min-width: 300px;
        }

        h2 {
            border-bottom: 2px solid var(--accent-glow);
            padding-bottom: 5px;
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2a1147;
            border: 1px solid #4a1d85;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* ルーレット部分 */
        .roulette-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }

        #roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--accent-gold);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
            background: conic-gradient(
                #ff4444 0deg 180deg,
                #44aa44 180deg 360deg
            );
        }

        .roulette-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid var(--accent-gold);
            z-index: 10;
        }

        .status-box {
            margin-top: 15px;
            padding: 10px;
            background: #110422;
            border-radius: 6px;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 自由記入エリア（右側）のスタイル */
        .custom-content {
            background: #110422;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .custom-content img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid var(--accent-glow);
        }
    </style>
</head>
<body>

    <h1>🎰 ブレインロットカジノ 🎰</h1>
    <div class="subtitle">〜 全ぶっぱ強制！絶望の50/50ルーレット 〜</div>

    <div class="container">
        <!-- プレイヤー・ルーレットパネル -->
        <div class="panel">
            <h2>🎲 カジノフロア</h2>
            <div class="form-group">
                <label>TikTokネーム</label>
                <input type="text" id="player-name" placeholder="例：@brainrot_king">
            </div>
            <div class="form-group">
                <label>所持チップ（オールイン対象）</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div id="player-chips" style="font-size: 1.5rem; color: var(--accent-gold); font-weight: bold;">100 枚</div>
                    <button onclick="addChips(100)" style="width: auto; padding: 5px 10px; font-size: 0.8rem;">+100追加</button>
                </div>
            </div>

            <!-- ルーレット本体 -->
            <div class="roulette-container">
                <div class="roulette-pointer"></div>
                <div id="roulette-wheel"></div>
            </div>

            <button id="spin-btn" onclick="spinRoulette()">全ぶっぱで回す！（オールイン）</button>
            <div class="status-box" id="result-message">名前を決めて全ぶっぱスピン！</div>
        </div>

        <!-- 自由記入エリア（画像とテキストをここに書けます） -->
        <div class="panel">
            <h2>📌 インフォメーション / キャラ紹介</h2>
            <div class="custom-content" id="free-area">
                <!-- ここに自由なテキストや画像タグ（<img>）を書き込めます -->
                <p><b>✨ 現在開催中のイベント・ルール</b></p>
                <p>所持しているチップをすべて賭ける「全ぶっぱ（オールイン）」専用のカジノです！</p>
                <p>当たれば微増、ハズレれば全ロス！</p>
                
                <!-- 画像を表示したいときは下のコメントアウトを外して画像のURLを入れてね -->
                <!-- <img src="ここに画像のURLやファイル名を入れる" alt="キャラ画像"> -->
            </div>
        </div>
    </div>

    <script>
        let chips = 100;
        let isSpinning = false;
        let currentRotation = 0;

        function updateDisplay() {
            document.getElementById('player-chips').innerText = chips + ' 枚';
        }

        // チップをテスト用に追加できるボタン用
        function addChips(amount) {
            chips += amount;
            updateDisplay();
        }

        function spinRoulette() {
            if (isSpinning) return;
            const name = document.getElementById('player-name').value.trim();

            if (!name) {
                alert('TikTokネームを入力してください！');
                return;
            }
            if (chips <= 0) {
                alert('チップが0枚のため、全ぶっぱできません！');
                return;
            }

            isSpinning = true;
            const bet = chips; // 所持チップを全額ベット（全ぶっぱ）
            chips = 0; // 一旦0にする（勝てば返る/増える）
            updateDisplay();
            
            document.getElementById('result-message').innerText = `${name} さんが ${bet} チップ全ぶっぱ！回転中……`;

            // イカサマ判定：N（50%）か はずれ（50%）
            const isWin = Math.random() < 0.5; 
            const targetDegree = isWin ? (Math.random() * 160 + 10) : (Math.random() * 160 + 190);
            
            const extraSpins = 360 * 5; 
            currentRotation += extraSpins + (targetDegree - (currentRotation % 360));

            const wheel = document.getElementById('roulette-wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                if (isWin) {
                    // N：微増（全ぶっぱ額の1.2倍返し）
                    const reward = Math.floor(bet * 1.2);
                    chips += reward;
                    document.getElementById('result-message').innerHTML = `🎉 <span style="color:#44aa44;">【N】当り！(+${reward}チップ返還)</span> 命拾いしたな！`;
                } else {
                    // はずれ：全額没収（0のまま）
                    document.getElementById('result-message').innerHTML = `💀 <span style="color:#ff4444;">【はずれ】全額没収！</span> 綺麗に溶けましたwww`;
                }
                updateDisplay();
            }, 4000);
        }

        updateDisplay();
    </script>
</body>
</html>
