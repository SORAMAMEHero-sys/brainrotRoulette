<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブレインロットカジノ</title>
    <style>
        :root {
            --bg-color: #0f051d;
            --panel-bg: #1a0b2e;
            --accent-glow: #ff007f;
            --accent-gold: #ffd700;
            --text-main: #ffffff;
            --text-sub: #b19cd9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-gold);
            text-shadow: 0 0 10px var(--accent-glow);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-glow);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            flex: 1;
            min-width: 320px;
        }

        h2 {
            border-bottom: 2px solid var(--accent-glow);
            padding-bottom: 5px;
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2a1147;
            border: 1px solid #4a1d85;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            height: 120px;
            font-family: monospace;
        }

        button {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* ルーレット部分（心理戦：SSRが広く見えるが、止まるのはNかハズレ） */
        .roulette-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }

        #roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--accent-gold);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
            /* 見た目はSSR(金色)が約70%を占める心理戦仕様！ */
            background: conic-gradient(
                #ffd700 0deg 250deg,    
                #ff4444 250deg 305deg,  
                #44aa44 305deg 360deg   
            );
        }

        .roulette-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid var(--accent-gold);
            z-index: 10;
        }

        .status-box {
            margin-top: 15px;
            padding: 10px;
            background: #110422;
            border-radius: 6px;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 表示用のプレビューエリア */
        .preview-box {
            background: #110422;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            min-height: 150px;
            border: 1px dashed #4a1d85;
            margin-bottom: 15px;
        }

        .preview-box img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid var(--accent-glow);
        }
    </style>
</head>
<body>

    <h1>🎰 ブレインロットカジノ 🎰</h1>
    <div class="subtitle">〜 1回100チップ・心理戦ルーレット配信ツール 〜</div>

    <div class="container">
        <!-- 左側：カジノフロア -->
        <div class="panel">
            <h2>🎲 カジノフロア</h2>
            <div class="form-group">
                <label>TikTokネーム</label>
                <input type="text" id="player-name" placeholder="例：@brainrot_king">
            </div>
            <div class="form-group">
                <label>所持チップ（1回 100ベット）</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div id="player-chips" style="font-size: 1.5rem; color: var(--accent-gold); font-weight: bold;">500 枚</div>
                    <button onclick="addChips(100)" style="width: auto; padding: 5px 10px; font-size: 0.8rem;">+100追加</button>
                </div>
            </div>

            <!-- ルーレット本体 -->
            <div class="roulette-container">
                <div class="roulette-pointer"></div>
                <div id="roulette-wheel"></div>
            </div>

            <button id="spin-btn" onclick="spinRoulette()">100チップ払って回す！</button>
            <div class="status-box" id="result-message">名前を決めてスピン！</div>
        </div>

        <!-- 右側：自由に書き換えられるテキスト・画像エリア -->
        <div class="panel">
            <h2>📌 インフォメーション / キャラ紹介</h2>
            
            <!-- リアルタイムプレビューされる場所 -->
            <div class="preview-box" id="display-area">
                <p><b>✨ 現在のルール</b></p>
                <p>・1回 100チップ消費！</p>
                <p>・見た目はSSRが爆当たりしそうですが…？w</p>
            </div>

            <!-- 自由に文字が打てるテキスト欄 -->
            <div class="form-group">
                <label>📝 自由編集テキスト欄（HTMLタグ使用可）</label>
                <textarea id="custom-input"><p><b>✨ 現在のルール</b></p>
<p>・1回 100チップ消費！</p>
<p>・見た目はSSRが爆当たりしそうですが…？w</p>
<!-- 画像を入れたいときは下のタグのURLを書き換えてね -->
<!-- <img src="画像のURL" alt="キャラ"> --></textarea>
            </div>
            <button onclick="updateFreeArea()">文字・画像を反映する！</button>
        </div>
    </div>

    <script>
        let chips = 500; // 初期チップを少し余裕のある500に設定
        let isSpinning = false;
        let currentRotation = 0;

        function updateDisplay() {
            document.getElementById('player-chips').innerText = chips + ' 枚';
        }

        function addChips(amount) {
            chips += amount;
            updateDisplay();
        }

        // 自由テキスト欄の内容をプレビューに反映させる関数
        function updateFreeArea() {
            const userInput = document.getElementById('custom-input').value;
            document.getElementById('display-area').innerHTML = userInput;
        }

        function spinRoulette() {
            if (isSpinning) return;
            const name = document.getElementById('player-name').value.trim();
            const bet = 100; // 1回固定のベット額

            if (!name) {
                alert('TikTokネームを入力してください！');
                return;
            }
            if (chips < bet) {
                alert('チップが100枚未満のため回せません！「+100追加」で補充してください！');
                return;
            }

            isSpinning = true;
            chips -= bet; // 100チップ消費
            updateDisplay();
            
            document.getElementById('result-message').innerText = `${name} さんが 100チップベット！回転中……`;

            // 【完全犯罪イカサマ】
            // 確率：Nが50% / はずれが50%（※見た目のSSRエリアには絶対に止まらない！）
            const isN = Math.random() < 0.5; 

            let targetDegree;
            if (isN) {
                // Nのエリア（305度〜360度）に強制着地
                targetDegree = Math.random() * 50 + 310;
            } else {
                // はずれのエリア（250度〜305度）に強制着地
                targetDegree = Math.random() * 50 + 255;
            }
            
            const extraSpins = 360 * 5; 
            currentRotation += extraSpins + (targetDegree - (currentRotation % 360));

            const wheel = document.getElementById('roulette-wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                if (isN) {
                    const reward = Math.floor(bet * 1.2); // 100 × 1.2 = 120チップバック（20チップの微増）
                    chips += reward;
                    document.getElementById('result-message').innerHTML = `🎉 <span style="color:#44aa44;">【N】当り！(+${reward}チップ獲得)</span> 微妙なプラス！`;
                } else {
                    document.getElementById('result-message').innerHTML = `💀 <span style="color:#ff4444;">【はずれ】没収！(-100チップ)</span> 綺麗に溶けましたwww`;
                }
                updateDisplay();
            }, 4000);
        }

        updateDisplay();
    </script>
</body>
</html>
